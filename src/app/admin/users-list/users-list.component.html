<div class="admin-shell">
  <app-sidebar />
  <main class="admin-main">
    <div class="admin-page-head">
      <div>
        <p class="eyebrow">YOUR COMMUNITY</p>
        <h1>Around the table.</h1>
      </div>
    </div>
    @if (loading) {
      <div class="skeleton recipe-skeleton"></div>
    } @else if (error) {
      <div class="state-panel" role="alert">
        <p>{{ error }}</p>
        <button class="button" (click)="getAllUsers()">Try again</button>
      </div>
    } @else {
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Name</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody>
            @for (item of allUsers; track item._id) {
              <tr>
                <td>{{ $index + 1 }}</td>
                <td>{{ item.username }}</td>
                <td>{{ item.email }}</td>
              </tr>
            } @empty {
              <tr>
                <td colspan="3" class="text-center py-5">
                  Nothing to show here yet.
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    }
  </main>
</div>
